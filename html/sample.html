<html ng-app="SampleApp">
<head>
    <title>Sample Page</title>
    <script src='../scripts/angularjs.js'></script>
    <script src='../scripts/sample.js'></script>
</head>
<body ng-controller='SampleController'>

    <br/>
    <form action="../php/sample.php" method='POST' enctype='multipart/form-data'>
        <table border=1>
        <tr ng-repeat='dbShop in db_shops'>
            <td style="padding: 0px 30px 0px 30px;">
                {{ dbShop }}
            </td>
            <td align='left' style="padding: 0px 40px 15px 0px;">
                <br/>
                <ul style="list-style-type: none;">
                    <li ng-repeat='csvShop in csv_shops'>
                        <input  type="radio" 
                                ng-model="shopList[$parent.$index].csvIndex" 
                                ng-value='$index'
                                ng-click="uncheck_shop_in_other_groups($parent.$index, $index);"
                                required /> 
                            {{ csvShop }}
                    </li>
                </ul>
            </td>
        </tr>
        </table>
        Selected Shops: {{ shopList }}
        <br/><br/>
        <input type='submit' value='Submit' />
    </form>
</body>
</html>
