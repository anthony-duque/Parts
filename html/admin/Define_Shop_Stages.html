<html ng-app="DefineShopStagesApp">
    <head>
        <title>Define Company Stages</title>
        <script src="../../scripts/angularjs.js"></script>
        <script src="../../scripts/admin/Define_Shop_Stages.js"></script>
        <style>
            .selectedStage {
                background-color: lightgreen;
            }
        </style>
    </head>
    <body ng-controller="DefineShopStagesCtrlr">

        <table align="center">
        <tr>
            <th>
                <h2><u>
                    Define Shop Stages
                </u></h2>
            </th>
        </tr>
        </table>

        <br/>

        <table align="center">
        <tr>
            <td>Shop:</td>
            <td>
                <select ng-model="selectedShop" ng-change="Get_Shop_Stages(selectedShop.id);">
                    <option value="">Select a Shop</option>
                    <option ng-repeat="shop in shopList" value="{{ shop.id }}">
                        {{ shop.name }}
                    </option>
                </select>
            </td>
        </tr>
        </table>
        
        <br/>
        
        <table id="tblMain" align="center" border="1" width="35%" ng-show="selectedShop">
        <thead>
            <tr>
                <th>
                    Stage Headers
                </th>
                <th>
                    Shop Stages
                </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>
                    <table width="100%">
                    <tr ng-repeat="heading in stageHeadings | orderBy:'description'">
                        <td>
                            <a ng-href="#" ng-dblclick="addHeadingToCompany(heading);">
                                {{ heading.description }}
                            </a>
                        </td>
                    </tr>
                    </table>
                </td>
                <td>
                    <table width="100%">
                    <tr ng-repeat="stage in shopStages">
                        <td ng-click="selectStage(stage);" ng-class="(stage.heading_id === stageSelected.heading_id) ? 'selectedStage' : ''">
                            <a ng-href="#" ng-dblclick="removeCompanyHeading(stage);">
                                {{ stage.description }}
                            </a>
                        </td>
                    </tr>
                    </table>
                </td>
                <td rowspan="2" width="10%" ng-show="stageSelected">
                    <table valign="middle" align="left" border="1" ng-hide="!stageSelected">
                    <tr>
                        <td>
                           <a href="#" ng-click="moveStageUp(stageSelected.heading_id);">
                                &uarr;
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <a href="#" ng-click="moveStageDown(stageSelected.heading_id);">
                                &darr;
                            </a>
                        </td>
                    </tr>
                    </table>
                </td>
            </tr>
        </tbody>
        </table>

        <br/>

        <table align="center">
        <tr>
            <td align="center">
                <input type="submit" value="Update" ng-click="Update_Stages()">
            </td>    
        </tr>
        </table>
    </body>
</html>
