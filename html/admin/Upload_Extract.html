<html ng-app="csvUploadApp">

<head>
    <title>Extracts Upload</title>
    <script src='../../scripts/angularjs.js'></script>
    <script src='../../scripts/admin/Upload_Extract.js'></script>
 </head>

<body ng-controller='csvUploadController'>
 
    <form action="{{ formURL(); }}" method='POST' enctype='multipart/form-data'>

        <input type='hidden' name='uploadDateTime' value='{{ currDateTime | date:"short" }}'>
        <table align='center'>
            <caption>
                <b>Upload Extract File</b>
            </caption>
            <tr>
                <th>CCC Extract CSV file:</th>
                <td>
                    <input type='file' name="ExtractCSV" required />
                </td>
            </tr>
            <tr>
                <td align='center' colspan='2'>
                    <input type='submit' value='Upload File' />
                </td>
            </tr>
        </table>

    </form>

</body>
</html>
