<table  ng-controller='PriorityCarController'
        style="height: 100%;"
        width='100%'
        align='center'
        border=0
        ng-dblclick='DoubleClicked("Car_View.html?repairID=" + eachCar.repair_id);'>
<tr>
    <td rowspan='2' valign='middle' ng-hide='$index == 0'>
        <a ng-click='MovePriority($index, -1);' href='' class='arrow'>
            <h4>&Larr;</h4>
        </a>
    </td>
    <td align='center'>
        <br/>
    </td>
    <td rowspan='2' valign='middle'>
        <a ng-click='MovePriority($index, 1);' href='' class='arrow' ng-hide='$index == (filteredCars.length - 1)'>
            <h4>&Rarr;</h4>
        </a>
    </td>
</tr>
<tr>
    <td>
        <div ng-include='"./html/Car.html"'></div>
    </td>
</tr>
<tr>
    <td colspan='3' align='center'>
        <a ng-click='RemoveFromQueue(eachCar);' href='' class='arrow'>
            <h4>&Darr;</h4>
        </a>
    </td>
</tr>
</table>
