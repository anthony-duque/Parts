
<!doctype html>
<html ng-app="PartsApp">
  <head >

    <title>The Parts App</title>

    <script src='./scripts/angularjs.js'></script>
    <!--script src='./scripts/angularjs.min.js'></script-->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.6.1/angular-route.js"></script>

    <script src='./scripts/index.js'></script>
    <script src="./scripts/Route.js"></script>

    <script src='./scripts/Filters.js'></script>
    <script src='./scripts/UtilityFunctions.js'></script>

    <script src="scripts/Order_Materials.js"></script>

    <script src="scripts/Production.js"></script>
    <script src='./scripts/Estimator_View.js'></script>
    <script src='./scripts/Technician_View.js'></script>
    
     <!-- Deliveries Tab Controllers -->
    <script src='./scripts/Deliveries.js'></script>
    <script src='./scripts/DeliveriesByCar.js'></script>
    <script src='./scripts/DeliveriesByVendor.js'></script>

    <script src="./scripts/Stage.js"></script>
    <script src='./scripts/Stage_Car.js'></script>
    <script src='./scripts/Priority_Car.js'></script>
     
    <script src="scripts/Parts_Search.js"></script>
    <script src="scripts/Return_Forms.js"></script>
    <script src="scripts/Follow_Up.js"></script>
    <script src="scripts/Vendors.js"></script>

    <link rel="stylesheet" href="./styles/bootstrap.min.css" />
    <script src="scripts/bootstrap.bundle.min.js.js"></script>
    <link rel="stylesheet" href="./styles/Parts.css">

  </head>

  <body ng-controller="MainController" style="background-color: lightgrey;">
    <table width='100%'>
        <tr>
            <td align='left'>
                <b>Today's Date:</b> 
                &nbsp;<u>{{ todaysDate }}</u>
            </td>
            <td align='center'>
                <b>Shop:</b>
                &nbsp;
                <select ng-model='locationID' class="form-select">
                    <option ng-repeat='loc in locations' value='{{ loc.id }}'>{{ loc.location }}</option>
                </select>
                <br/>
            </td>
            <td align='right'>
                <b>Last Update:</b>
                &nbsp;{{ last_update }}
            </td>
            <td align='right'>
                <button class="btn btn-danger" ng-click='Logout();'>
                    Logout
                </button>
            </td>
        </tr>
    </table>
   <nav class="navbar navbar-expand-lg navbar-light bg-primary bg-gradient">

        <button onclick="location.href='#/stage';" class="btn btn-light {{ location.pathname == '/stage' ? 'active' : '' }}">
            Stage
        </button>

        &nbsp;
        
        <button onclick="location.href='#/production';" class="btn btn-secondary {{ location.pathname == '/production' ? 'active' : '' }}">
            Production
        </button>

        &nbsp;
        
        <button onclick="location.href='#/deliveries';" class="btn btn-success {{ location.pathname == '/deliveries' ? 'active' : '' }}">
            Deliveries
        </button>

        &nbsp;
        
        <button onclick="location.href='#/parts-search';" class="btn btn-danger {{ location.pathname == '/parts-search' ? 'disabled' : '' }}">
            Part Search
        </button>

        &nbsp;
        
        <button onclick="location.href='#/materials';" class="btn btn-warning">
            Materials
        </button>

        &nbsp;
        
        <button onclick="location.href='#/follow-up';" class="btn btn-info">
            Follow-up
        </button>

        &nbsp;
        
        <button onclick="location.href='#/return-forms';" class="btn btn-light">
            Return Forms
        </button>

        &nbsp;
        
        <button onclick="location.href='#/vendors';" class="btn btn-dark">
            Vendors
        </button>

    </nav>

    <ng-view>
        <!-- This is where the content of each tab will show depending on which tab is clicked -->
    </ng-view> 

</body>
</html>
